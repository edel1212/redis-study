port 26381
# 클라이언트가 센티널에 접근할 호스트 주소/포트
sentinel announce-ip "host.docker.internal"
sentinel announce-port 26381
# monitor가 도메인 기준으로 host를 찾을 수 있도록 추가 설정 (Docker로 진행하기에 발생한 문제)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
# 감시 대상: 이름 cache-redis, 호스트:6379, quorum=2
sentinel monitor cache-redis host.docker.internal 6379 2
sentinel down-after-milliseconds cache-redis 5000
sentinel failover-timeout cache-redis 10000

# Generated by CONFIG REWRITE
dir "/data"
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* +@all
sentinel myid bc65d3ee2ff8149a459e47f93577ec93dff50c7f
sentinel config-epoch cache-redis 0
sentinel leader-epoch cache-redis 0
sentinel current-epoch 0

sentinel known-replica cache-redis host.docker.internal 6381

sentinel known-replica cache-redis host.docker.internal 6380

sentinel known-sentinel cache-redis host.docker.internal 26380 6163e3d7841ea87e45dbab1487842ee1b3fa7f4c

sentinel known-sentinel cache-redis host.docker.internal 26379 977415f6bc4907b4bcde1cb5009be390951eafbc
