spring:
  data:
    redis:
      host: localhost
      port: 6379
      password:             # redis PW
      timeout: 3000ms       # connection time out

      # Lettuce setting
      lettuce:
        pool:
          max-active: 8     # pool max active count
          max-idle: 8       # 최대 유지할 연결 개수입니다.
          min-idle: 0       # 최소한으로 유지할 연결 개수입니다.
          max-wait: -1ms    # poll에 남는 커넥션이 없을 때, 새로운 커넥션을 얻기 위해 기다리는 시간입니다. (-1 : 무한 대기)

  # RDB
  datasource:
    url: jdbc:mariadb://localhost:3306/test
    username: ${DB_USERNAME:root}
    password: ${DB_PW:123}

  # JPA
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MariaDBDialect
      ddl-auto: update